# Проверка каждого пуша и pull request'а. Мультиязычность — часть ворот:
# PR не пройдёт, если
#   • в коде появилась строка без перевода, неверный ключ t() или пропал
#     плейсхолдер в одном из языков (npm run i18n);
#   • упал любой юнит-тест (npm test);
#   • пакет языка или индекс поиска выпал из офлайн-кэша (npm run build падает);
#   • на любом из 7 языков и 4 размеров экрана есть переполнение, сырой ключ,
#     чужой язык, неверное направление, ошибка в консоли (npm run test:e2e);
#   • вёрстка ключевых экранов разошлась со снимками (npm run test:visual).
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-and-unit:
    name: i18n gate + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: i18n (AST-проверка исходников, словари, данные, поиск, ИИ)
        run: npm run i18n
      - name: Юнит-тесты
        run: npm test

  build-and-e2e:
    name: build + E2E (7 языков × 4 экрана) + снимки
    runs-on: ubuntu-latest
    needs: i18n-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Браузер Playwright (версия из package-lock)
        run: npx playwright install --with-deps chromium
      - name: Сборка (падает, если язык выпал из офлайн-кэша)
        run: npm run build
      - name: Сборка с облаком-заглушкой (экраны с аккаунтом)
        run: npm run build:cloud
      - name: E2E — экраны, RTL, переполнение, офлайн, жизненный цикл языка
        run: npm run test:e2e
      - name: Визуальная регрессия
        run: npm run test:visual
      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
